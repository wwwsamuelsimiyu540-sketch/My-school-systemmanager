<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My School System | Administration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#14213d;--navy2:#223761;--blue:#4169e1;--cyan:#28c7d9;--bg:#f3f6fc;--border:#e0e7f1;--muted:#758198;--green:#13835b;--red:#c93643;--orange:#a96b00}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#243047}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;overflow:auto;background:var(--navy);color:#fff;padding:18px 13px;z-index:10}
.brand{font-size:21px;font-weight:800;padding:12px 10px 23px}.brand span{color:var(--cyan)}
.group{font-size:10px;letter-spacing:1.2px;color:#aebfe0;padding:14px 10px 5px}
.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce5fa;padding:11px 10px;border-radius:8px;margin:3px 0;font-size:13px}
.navbtn:hover,.navbtn.active{background:var(--navy2);color:#fff}.navbtn.active{border-left:3px solid var(--cyan)}
.main{margin-left:245px;min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--border);height:70px;padding:0 25px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.content{padding:25px;max-width:1500px;margin:auto}.page-title{font-size:25px;margin:0 0 6px}.subtitle{font-size:13px;color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.card,.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 3px 12px #20345e08}
.stat-label{font-size:12px;color:var(--muted)}.stat-number{font-size:27px;font-weight:800;margin-top:9px;overflow-wrap:anywhere}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.panel h3{font-size:16px;margin:0}
.btn{border:0;border-radius:7px;padding:10px 13px;font-size:12px;font-weight:700}
.primary{background:var(--blue);color:#fff}.dark{background:var(--navy);color:#fff}.light{background:#edf2ff;color:var(--blue)}.danger{background:#fff0f0;color:var(--red)}.success{background:#e7f7ef;color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700}
.field input,.field select,.field textarea,.search{width:100%;min-width:0;border:1px solid #d6dfed;border-radius:7px;padding:10px;background:#fff;color:#243047}
.field textarea{min-height:70px}.full{grid-column:1/-1}
.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px;margin-bottom:13px}
.search{max-width:340px}.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:12px}th{background:#f7f9fd;color:#66728a}
.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:bold;background:#edf2ff;color:#4169e1}
.badge.active,.badge.present,.badge.approved,.badge.completed,.badge.paid{background:#e5f7ee;color:#13835b}
.badge.inactive,.badge.late,.badge.planned,.badge.partial{background:#fff1dc;color:#9a6500}
.badge.absent,.badge.rejected,.badge.cancelled{background:#ffe9e9;color:#c52d39}
.notice{padding:12px 14px;background:#edf5ff;color:#2854a3;border-radius:8px;font-size:13px;margin:12px 0}
.notice.error{background:#fff0f0;color:#b32631}.notice.success{background:#e8f8f0;color:#146c48}
.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none!important}
.small{font-size:12px;color:var(--muted)}.menu-toggle{display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu-toggle{display:inline-block}.content{padding:14px}.topbar{padding:0 12px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.grid{gap:9px}.card{padding:12px}.stat-number{font-size:22px}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand">MY <span>SCHOOL</span><br>SYSTEM</div>
  <div class="group">OVERVIEW</div>
  <button class="navbtn active" data-page="dashboard">🏠 Dashboard</button>
  <button class="navbtn" data-page="school">🏫 School Details</button>
  <div class="group">PEOPLE</div>
  <button class="navbtn" data-page="teachers">👨‍🏫 Teachers</button>
  <button class="navbtn" data-page="students">🎓 Students & Admissions</button>
  <div class="group">ACADEMICS</div>
  <button class="navbtn" data-page="classes">📚 Classes</button>
  <button class="navbtn" data-page="subjects">📖 Subjects</button>
  <button class="navbtn" data-page="assignments">🔗 Class Assignments</button>
  <button class="navbtn" data-page="attendance">🗓️ Attendance</button>
  <button class="navbtn" data-page="exams">📝 Exams</button>
  <button class="navbtn" data-page="results">📊 Exam Results</button>
  <div class="group">FINANCE</div>
  <button class="navbtn" data-page="charges">🧾 Fee Charges</button>
  <button class="navbtn" data-page="payments">💳 Payments</button>
  <button class="navbtn" data-page="balances">💰 Fee Balances</button>
  <div class="group">SYSTEM</div>
  <button class="navbtn" data-page="reports">📈 Reports</button>
  <button class="navbtn" data-page="settings">⚙️ Account Settings</button>
  <button class="navbtn" id="logoutBtn">↪ Sign Out</button>
</aside>

<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="btn light menu-toggle" id="menuToggle">☰</button>
    <div><strong id="schoolTitle">School Administration</strong><br><span class="small" id="schoolStatus">Checking account…</span></div>
  </div>
  <div style="text-align:right"><strong id="adminName">Administrator</strong><br><span class="small" id="adminEmail"></span></div>
</header>
<section class="content">
  <div id="message" class="hidden"></div>
  <div id="app"><div class="panel">Loading school system…</div></div>
  <p class="small">My School System · Secure school administration</p>
</section>
</main>

<script>
(() => {
"use strict";
const URL="https://ksidteqtztpfgirfumdz.supabase.co";
const KEY="sb_publishable_uI1GpE80MIvV73I62Jnx0w_lIOWv3bs";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
const app=$("app");
let user=null,profile=null,school=null,page="dashboard";
let cache={teachers:[],students:[],classes:[],subjects:[],exams:[],charges:[],payments:[],attendance:[],results:[]};

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const money=v=>"KES "+Number(v||0).toLocaleString("en-KE",{minimumFractionDigits:2,maximumFractionDigits:2});
function msg(t,type="info"){const e=$("message");e.className="notice"+(type==="error"?" error":type==="success"?" success":"");e.textContent=t;window.scrollTo({top:0,behavior:"smooth"});}
function clearMsg(){$("message").classList.add("hidden");}
function badge(s){s=s||"unknown";return `<span class="badge ${esc(s).toLowerCase()}">${esc(s)}</span>`;}
function header(t,s){return `<h1 class="page-title">${esc(t)}</h1><p class="subtitle">${esc(s)}</p>`;}
function field(label,name,opts={}) {
 const type=opts.type||"text",required=opts.required?"required":"",value=opts.value??"",placeholder=opts.placeholder||"";
 if(opts.options){return `<div class="field"><label>${esc(label)}${opts.required?" *":""}</label><select name="${esc(name)}" ${required}>${opts.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`;}
 return `<div class="field ${opts.full?"full":""}"><label>${esc(label)}${opts.required?" *":""}</label><input name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required} ${opts.min!==undefined?`min="${opts.min}"`:""} ${opts.step?`step="${opts.step}"`:""} ${opts.maxlength?`maxlength="${opts.maxlength}"`:""}></div>`;
}
function selectOptions(rows,labelFn,empty="Select..."){return [{value:"",label:empty},...rows.map(r=>({value:r.id,label:labelFn(r)}))];}
function formPanel(title,id,fields,button="Save Record"){
 return `<div class="panel"><div class="panel-head"><h3>${esc(title)}</h3></div><form id="${id}"><div class="form-grid">${fields.join("")}</div><div class="actions"><button class="btn primary" type="submit">${esc(button)}</button><button class="btn light" type="reset">Clear</button></div></form></div>`;
}
function tableHTML(columns,rows,empty="No records found."){
 if(!rows.length)return `<div class="empty">${esc(empty)}</div>`;
 return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td>${c.render?c.render(row):esc(row[c.key])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function listPanel(title,id,columns,rows,empty){return `<div class="panel"><div class="panel-head"><h3>${esc(title)}</h3><button class="btn light" onclick="refreshPage()">↻ Refresh</button></div><div id="${id}">${tableHTML(columns,rows,empty)}</div></div>`;}
function canManage(){return profile?.role==="school_admin"&&profile?.status==="active"&&school?.status==="approved";}
function sid(){return profile.school_id;}

async function init(){
 if(!window.supabase){app.innerHTML="Supabase library failed to load.";return;}
 const {data:{session},error}=await db.auth.getSession();
 if(error){app.textContent=error.message;return;}
 if(!session){location.href="school-login.html";return;}
 user=session.user;
 const p=await db.from("msys_user_profiles").select("*").eq("id",user.id).maybeSingle();
 if(p.error){app.innerHTML=`<div class="panel">Profile error: ${esc(p.error.message)}</div>`;return;}
 profile=p.data;
 if(!profile){app.innerHTML="<div class='panel'>Your account profile was not found. Contact the developer.</div>";return;}
 if(profile.role!=="school_admin"){
   if(profile.role==="developer"&&profile.status==="active"){location.href="developer.html";return;}
   app.innerHTML="<div class='panel'>This page is only for school administrators.</div>";return;
 }
 if(profile.status!=="active"||!profile.school_id){
   app.innerHTML=`<div class="panel"><h3>Account not active</h3><p>Your account is ${esc(profile.status)} or has no linked school. Contact the developer.</p><button class="btn dark" onclick="signOut()">Sign out</button></div>`;return;
 }
 const s=await db.from("msys_schools").select("*").eq("id",profile.school_id).maybeSingle();
 if(s.error||!s.data){app.innerHTML=`<div class="panel">School record error: ${esc(s.error?.message||"School not found")}</div>`;return;}
 school=s.data;
 $("schoolTitle").textContent=school.name;
 $("schoolStatus").textContent="School status: "+school.status;
 $("adminName").textContent=profile.full_name||profile.username||"Administrator";
 $("adminEmail").textContent=user.email||profile.phone||"";
 if(school.status!=="approved"){app.innerHTML=`<div class="panel"><h2>School ${esc(school.status)}</h2><p>Your school must be approved before school records can be managed.</p><button class="btn dark" onclick="signOut()">Sign out</button></div>`;return;}
 document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
 $("menuToggle").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
 $("logoutBtn").addEventListener("click",signOut);
 await go("dashboard");
}
const titles={
 dashboard:"Dashboard",school:"School Details",teachers:"Teachers",students:"Students",
 classes:"Classes",subjects:"Subjects",assignments:"Class Assignments",attendance:"Attendance",
 exams:"Exams",results:"Exam Results",charges:"Fee Charges",payments:"Payments",
 balances:"Fee Balances",reports:"Reports",settings:"Account Settings"
};
window.go=async function(p){
 if(!canManage()){msg("Your account or school is no longer approved.","error");return;}
 page=p;clearMsg();
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 $("sidebar").classList.remove("open");
 const funcs={dashboard:dashboardPage,school:schoolPage,teachers:teachersPage,students:studentsPage,classes:classesPage,subjects:subjectsPage,assignments:assignmentsPage,attendance:attendancePage,exams:examsPage,results:resultsPage,charges:chargesPage,payments:paymentsPage,balances:balancesPage,reports:reportsPage,settings:settingsPage};
 await (funcs[p]||dashboardPage)();
};
window.refreshPage=()=>go(page);
async function fetchRows(table,order="created_at",ascending=false){
 const r=await db.from(table).select("*").eq("school_id",sid()).order(order,{ascending}).limit(1000);
 if(r.error)throw r.error;return r.data||[];
}
async function safeFetch(table,order){try{return await fetchRows(table,order);}catch(e){msg("Could not load "+table+": "+e.message,"error");return [];}}
async function insert(table,row){const r=await db.from(table).insert(row);if(r.error)throw r.error;}
async function update(table,id,row){const r=await db.from(table).update(row).eq("id",id).eq("school_id",sid());if(r.error)throw r.error;}
function fail(e){msg("Operation failed: "+(e.message||e),"error");}
function saved(t){msg(t+" saved successfully.","success");}

async function dashboardPage(){
 app.innerHTML=header("School Dashboard","Welcome to your school administration workspace.")+
 `<div class="grid">${[
 ["🏫","School",school.name],["👨‍🏫","Teachers","…"],["🎓","Students","…"],["📚","Classes","…"]
 ].map((x,i)=>`<div class="card"><div style="font-size:22px">${x[0]}</div><p class="stat-label">${x[1]}</p><div class="stat-number" id="stat${i}">${esc(x[2])}</div></div>`).join("")}</div>
 <div class="panel"><h3>Quick Actions</h3><div class="actions">
 <button class="btn primary" onclick="go('teachers')">Register Teacher</button>
 <button class="btn primary" onclick="go('students')">Admit Student</button>
 <button class="btn light" onclick="go('attendance')">Record Attendance</button>
 <button class="btn light" onclick="go('charges')">Add Fee Charge</button>
 <button class="btn light" onclick="go('exams')">Create Exam</button>
 </div></div>
 <div class="panel"><h3>School Information</h3><br>${tableHTML([{label:"School",key:"name"},{label:"Registration No.",key:"registration_number"},{label:"County",key:"county"},{label:"Status",render:r=>badge(r.status)}],[school])}</div>`;
 for(const [i,t] of [[1,"msys_teachers"],[2,"msys_students"],[3,"msys_classes"]]){
  const r=await db.from(t).select("id",{count:"exact",head:true}).eq("school_id",sid());
  const el=$("stat"+i);if(el)el.textContent=r.error?"—":r.count??0;
 }
}

function schoolPage(){
 app.innerHTML=header("School Details","View your registered school information.")+
 `<div class="panel"><h3>Registered Details</h3><br>${tableHTML([
 {label:"School Name",key:"name"},{label:"Registration Number",key:"registration_number"},
 {label:"County",key:"county"},{label:"Address",key:"address"},
 {label:"Phone",key:"phone"},{label:"Contact Email",key:"contact_email"},
 {label:"Approval Status",render:r=>badge(r.status)}
 ],[school])}<div class="notice">For official changes to your school registration details, contact the system developer.</div></div>`;
}

async function teachersPage(){
 const data=await safeFetch("msys_teachers");cache.teachers=data;
 app.innerHTML=header("Teacher Management","Register teachers and maintain staff records.")+
 formPanel("Register Teacher","teacherForm",[
 field("Full Name","full_name",{required:true}),field("Teacher Number","teacher_number",{required:true}),
 field("Email","email",{type:"email"}),field("Phone","phone"),field("Subject","subject"),
 field("Employment Date","employment_date",{type:"date"})
 ])+listPanel("Teacher Register","teacherList",[
 {label:"Name",key:"full_name"},{label:"Teacher No.",key:"teacher_number"},
 {label:"Phone",key:"phone"},{label:"Subject",key:"subject"},{label:"Status",render:r=>badge(r.status)},
 {label:"Action",render:r=>`<button class="btn ${r.status==="active"?"danger":"success"}" onclick="toggleStatus('msys_teachers','${r.id}','${r.status==="active"?"inactive":"active"}')">${r.status==="active"?"Deactivate":"Activate"}</button>`}
 ],data);
 $("teacherForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  try{await insert("msys_teachers",{school_id:sid(),full_name:f.get("full_name").trim(),teacher_number:f.get("teacher_number").trim(),email:f.get("email")||null,phone:f.get("phone")||null,subject:f.get("subject")||null,employment_date:f.get("employment_date")||null,status:"active",created_by:user.id});saved("Teacher");await go("teachers");}
  catch(err){fail(err);}
 };
}

async function studentsPage(){
 const data=await safeFetch("msys_students");cache.students=data;
 app.innerHTML=header("Students & Admissions","Register students and manage admission records.")+
 formPanel("Admit Student","studentForm",[
 field("Full Name","full_name",{required:true}),field("Admission Number","admission_number",{required:true}),
 field("Gender","gender",{options:[{value:"",label:"Select gender"},{value:"Male",label:"Male"},{value:"Female",label:"Female"},{value:"Other",label:"Other"}]}),
 field("Date of Birth","date_of_birth",{type:"date"}),field("Class / Grade","class_name"),
 field("Admission Date","admission_date",{type:"date",value:today()}),field("Guardian Name","guardian_name"),
 field("Guardian Phone","guardian_phone"),field("Guardian Email","guardian_email",{type:"email"})
 ])+listPanel("Student Register","studentList",[
 {label:"Student",key:"full_name"},{label:"Admission No.",key:"admission_number"},
 {label:"Class",key:"class_name"},{label:"Guardian",key:"guardian_name"},
 {label:"Guardian Phone",key:"guardian_phone"},{label:"Status",render:r=>badge(r.status)},
 {label:"Action",render:r=>`<button class="btn ${r.status==="active"?"danger":"success"}" onclick="toggleStatus('msys_students','${r.id}','${r.status==="active"?"inactive":"active"}')">${r.status==="active"?"Deactivate":"Activate"}</button>`}
 ],data);
 $("studentForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  try{await insert("msys_students",{school_id:sid(),full_name:f.get("full_name").trim(),admission_number:f.get("admission_number").trim(),gender:f.get("gender")||null,date_of_birth:f.get("date_of_birth")||null,class_name:f.get("class_name")||null,admission_date:f.get("admission_date")||today(),guardian_name:f.get("guardian_name")||null,guardian_phone:f.get("guardian_phone")||null,guardian_email:f.get("guardian_email")||null,status:"active",created_by:user.id});saved("Student");await go("students");}
  catch(err){fail(err);}
 };
}
window.toggleStatus=async(table,id,status)=>{
 try{await update(table,id,{status,updated_at:new Date().toISOString()});saved("Status");await go(page);}catch(e){fail(e);}
};

async function classesPage(){
 const data=await safeFetch("msys_classes","name");cache.classes=data;
 app.innerHTML=header("Classes","Create the classes and streams in your school.")+
 formPanel("Add Class","classForm",[
 field("Class / Grade Name","name",{required:true}),field("Stream","stream"),
 field("Academic Year","academic_year",{placeholder:"e.g. 2026"})
 ])+listPanel("Classes","classList",[
 {label:"Class",key:"name"},{label:"Stream",key:"stream"},{label:"Academic Year",key:"academic_year"},{label:"Status",render:r=>badge(r.status)}
 ],data);
 $("classForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await insert("msys_classes",{school_id:sid(),name:f.get("name").trim(),stream:f.get("stream")||null,academic_year:f.get("academic_year")||null,status:"active",created_by:user.id});saved("Class");await go("classes");}catch(err){fail(err);}};
}
async function subjectsPage(){
 const data=await safeFetch("msys_subjects","name");cache.subjects=data;
 app.innerHTML=header("Subjects","Manage the subjects taught at your school.")+
 formPanel("Add Subject","subjectForm",[field("Subject Name","name",{required:true}),field("Subject Code","subject_code")])+
 listPanel("Subjects","subjectList",[{label:"Subject",key:"name"},{label:"Code",key:"subject_code"},{label:"Status",render:r=>badge(r.status)}],data);
 $("subjectForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await insert("msys_subjects",{school_id:sid(),name:f.get("name").trim(),subject_code:f.get("subject_code")||null,status:"active",created_by:user.id});saved("Subject");await go("subjects");}catch(err){fail(err);}};
}

async function assignmentsPage(){
 const [classes,subjects,teachers,assignments]=await Promise.all([
 safeFetch("msys_classes","name"),safeFetch("msys_subjects","name"),safeFetch("msys_teachers","full_name"),safeFetch("msys_class_subjects")
 ]);
 cache.classes=classes;cache.subjects=subjects;cache.teachers=teachers;
 const className=id=>classes.find(x=>x.id===id)?.name||"Unknown";
 const subjectName=id=>subjects.find(x=>x.id===id)?.name||"Unknown";
 const teacherName=id=>teachers.find(x=>x.id===id)?.full_name||"Not assigned";
 app.innerHTML=header("Class Assignments","Assign subjects and teachers to classes.")+
 formPanel("Assign Subject and Teacher","assignmentForm",[
 field("Class","class_id",{required:true,options:selectOptions(classes,x=>x.name)}),
 field("Subject","subject_id",{required:true,options:selectOptions(subjects,x=>x.name)}),
 field("Teacher","teacher_id",{options:selectOptions(teachers,x=>x.full_name,"No teacher assigned")})
 ])+listPanel("Assignments","assignmentList",[
 {label:"Class",render:r=>esc(className(r.class_id))},{label:"Subject",render:r=>esc(subjectName(r.subject_id))},
 {label:"Teacher",render:r=>esc(teacherName(r.teacher_id))}
 ],assignments);
 $("assignmentForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  try{await insert("msys_class_subjects",{school_id:sid(),class_id:f.get("class_id"),subject_id:f.get("subject_id"),teacher_id:f.get("teacher_id")||null,created_by:user.id});saved("Assignment");await go("assignments");}catch(err){fail(err);}
 };
}

async function attendancePage(){
 const [students,classes,records]=await Promise.all([safeFetch("msys_students","full_name"),safeFetch("msys_classes","name"),safeFetch("msys_attendance","attendance_date")]);
 cache.students=students;cache.classes=classes;cache.attendance=records;
 app.innerHTML=header("Attendance","Record and review student attendance by date.")+
 formPanel("Record Attendance","attendanceForm",[
 field("Student","student_id",{required:true,options:selectOptions(students,x=>x.full_name+" ("+x.admission_number+")")}),
 field("Class","class_id",{options:selectOptions(classes,x=>x.name,"Select class (optional)")}),
 field("Date","attendance_date",{type:"date",required:true,value:today()}),

 ])+listPanel("Attendance Register","attendanceList",[

async function resultsPage(){

async function paymentsPage(){
 const [students,charges,payments]=await Promise.all([safeFetch("msys_students","full_name"),safeFetch("msys_fee_charges"),safeFetch("msys_fee_payments")]);
 cache.students=students;cache.charges=charges;cache.payments=payments;
 app.innerHTML=header("Fee Payments","Record payments received from students.")+
 formPanel("Record Payment","paymentForm",[
 field("Student","student_id",{required:true,options:selectOptions(students,x=>x.full_name+" ("+x.admission_number+")")}),
 field("Fee Charge","fee_charge_id",{options:selectOptions(charges,x=>x.description+" — "+money(x.amount),"Unallocated payment")}),
 field("Amount (KES)","amount",{type:"number",required:true,min:0.01,step:"0.01"}),
 field("Payment Method","payment_method",{required:true,options:["cash","bank","mobile_money","cheque","other"].map(x=>({value:x,label:x.replace("_"," ")}))}),
 field("Reference Number","reference_number"),field("Payment Date","payment_date",{type:"date",required:true,value:today()}),
 field("Notes","notes")
 ])+listPanel("Payment Register","paymentList",[
 {label:"Date",key:"payment_date"},{label:"Student",render:r=>esc(students.find(s=>s.id===r.student_id)?.full_name||"Unknown")},
 {label:"Amount",render:r=>money(r.amount)},{label:"Method",key:"payment_method"},{label:"Reference",key:"reference_number"}
 ],payments);
 $("paymentForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),student=students.find(s=>s.id===f.get("student_id")),charge=charges.find(c=>c.id===f.get("fee_charge_id"));
  if(!student){msg("Select a valid student.","error");return;}
  if(charge&&charge.student_id!==student.id){msg("The selected fee charge belongs to a different student.","error");return;}
  const amount=Number(f.get("amount"));if(amount<=0){msg("Payment must be greater than zero.","error");return;}
  try{await insert("msys_fee_payments",{school_id:sid(),student_id:student.id,fee_charge_id:charge?.id||null,amount,payment_method:f.get("payment_method"),reference_number:f.get("reference_number")||null,payment_date:f.get("payment_date"),notes:f.get("notes")||null,received_by:user.id});saved("Payment");await go("payments");}catch(err){fail(err);}
 };
}

async function balancesPage(){
 const [students,charges,payments]=await Promise.all([safeFetch("msys_students","full_name"),safeFetch("msys_fee_charges"),safeFetch("msys_fee_payments")]);
 const rows=students.map(s=>{
  const charged=charges.filter(c=>c.student_id===s.id).reduce((n,c)=>n+Number(c.amount),0);
  const paid=payments.filter(p=>p.student_id===s.id).reduce((n,p)=>n+Number(p.amount),0);
  return {name:s.full_name,admission_number:s.admission_number,charged,paid,balance:charged-paid};
 });
 app.innerHTML=header("Fee Balances","Compare total charges with recorded payments.")+
 `<div class="grid"><div class="card"><div class="stat-label">Total Charges</div><div class="stat-number">${money(charges.reduce((n,x)=>n+Number(x.amount),0))}</div></div><div class="card"><div class="stat-label">Total Payments</div><div class="stat-number">${money(payments.reduce((n,x)=>n+Number(x.amount),0))}</div></div><div class="card"><div class="stat-label">Outstanding Balance</div><div class="stat-number">${money(charges.reduce((n,x)=>n+Number(x.amount),0)-payments.reduce((n,x)=>n+Number(x.amount),0))}</div></div><div class="card"><div class="stat-label">Students</div><div class="stat-number">${students.length}</div></div></div>`+
 listPanel("Student Balances","balanceList",[
 {label:"Student",key:"name"},{label:"Admission No.",key:"admission_number"},
 {label:"Total Charged",render:r=>money(r.charged)},{label:"Total Paid",render:r=>money(r.paid)},
 {label:"Balance",render:r=>`<strong>${money(r.balance)}</strong>`}
 ],rows);
}

 `<div class="grid">${[
 ["Active Teachers",teachers.filter(x=>x.status==="active").length],
 ["Active Students",students.filter(x=>x.status==="active").length],
 ["Classes",classes.length],["Subjects",subjects.length],

 <button class="btn primary" onclick="window.print()">Print / Save Report</button>

}

function settingsPage(){
 app.innerHTML=header("Account Settings","Review account details and change your password.")+
 `<div class="panel"><h3>Account Information</h3><br>${tableHTML([
 {label:"Full Name",key:"full_name"},{label:"Username",key:"username"},
 {label:"Email",render:()=>esc(user.email||"")},{label:"Role",key:"role"},{label:"Account Status",render:r=>badge(r.status)}
 ],[profile])}</div>
 <div class="panel"><h3>Change Password</h3><br><form id="passwordForm"><div class="form-grid">
 ${field("New Password","password",{type:"password",required:true})}
 ${field("Confirm Password","confirm",{type:"password",required:true})}
 </div><div class="actions"><button class="btn primary" type="submit">Update Password</button></div></form>
 <p class="small">Use at least 8 characters.</p></div>`;
 $("passwordForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),p=f.get("password");
  if(String(p).length<8){msg("Use at least 8 characters.","error");return;}
  if(p!==f.get("confirm")){msg("Passwords do not match.","error");return;}
  const r=await db.auth.updateUser({password:String(p)});
  if(r.error){fail(r.error);return;}saved("Password");e.target.reset();
 };
}
window.signOut=async()=>{
 const {error}=await db.auth.signOut();
 if(error){fail(error);return;}location.href="school-login.html";
};
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"&&!location.pathname.endsWith("school-login.html"))location.href="school-login.html";});
init();
})();
</script>
