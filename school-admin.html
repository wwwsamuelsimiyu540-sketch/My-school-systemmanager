
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Administrator | My School System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f6fc;color:#17233f}
header{background:#111c3a;color:white;padding:20px}
main{max-width:850px;margin:25px auto;padding:20px}
section{background:white;padding:22px;border-radius:12px}
button{padding:11px 16px;border:0;border-radius:7px;background:#4169e1;color:white;cursor:pointer}
</style>
</head>
<body>
<header><h2>My School System</h2></header>
<main>
<section>
<h2>School Administrator Dashboard</h2>
<p id="status">Checking your account...</p>
<button id="logout">Sign out</button>
</section>
</main>
<script>
const db = window.supabase.createClient(
  "https://ksidteqtztpfgirfumdz.supabase.co",
  "sb_publishable_uI1GpE80MIvV73I62Jnx0w_lIOWv3bs"
);

(async()=>{
  const {data:{session}} = await db.auth.getSession();
  if(!session){
    location.replace("school-login.html");
    return;
  }

  const {data:profile,error} = await db
    .from("msys_user_profiles")
    .select("role,status,school_id,full_name")
    .eq("id",session.user.id)
    .maybeSingle();

  if(error || !profile || profile.role!=="school_admin" || profile.status!=="active"){
    document.getElementById("status").textContent =
      "Access denied. Please sign in with an approved school administrator account.";
    await db.auth.signOut();
    return;
  }

  document.getElementById("status").textContent =
    "Welcome, " + (profile.full_name || "School Administrator") +
    ". Your account is active. We will add the school management modules next.";
})();

document.getElementById("logout").onclick=async()=>{
  await db.auth.signOut();
  location.replace("school-login.html");
};
</script>
</body>
</html>
