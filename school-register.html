
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Your School | My School System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#142447;--blue:#315eea;--bg:#f3f6fc;--ink:#17233b;--muted:#65728a;--border:#dbe3f0;--danger:#b42318;--success:#067647}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#edf3ff,#f7fbff);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:100%;max-width:820px;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 55px rgba(20,36,71,.12);overflow:hidden}
.hero{background:linear-gradient(120deg,var(--navy),#24498f);color:#fff;padding:27px 30px}
.brand{font-weight:800;font-size:22px}
.hero p{margin:8px 0 0;color:#e1eaff;line-height:1.5}
main{padding:28px 30px 30px}
.notice{display:none;padding:13px 15px;border-radius:10px;margin-bottom:18px;line-height:1.45;overflow-wrap:anywhere}
.notice.show{display:block}
.notice.error{background:#fff0ef;border:1px solid #ffd2cf;color:var(--danger)}
.notice.success{background:#eafaf1;border:1px solid #b9e8cd;color:var(--success)}
.notice.info{background:#edf4ff;border:1px solid #c9dcff;color:#234a98}
h2{font-size:19px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
label{font-weight:700;font-size:13px;color:#34415b}
input{width:100%;border:1px solid #cfd8e8;border-radius:10px;padding:12px 13px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,94,234,.12)}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.section{border-top:1px solid #e9eef6;padding-top:23px;margin-top:7px}
.btn{width:100%;border:0;border-radius:11px;padding:14px 18px;background:linear-gradient(100deg,var(--blue),#2448b8);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.65;cursor:not-allowed}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:17px}
.foot a{color:var(--blue);font-weight:700;text-decoration:none}
.required{color:#c12626}
@media(max-width:620px){body{padding:10px}.hero{padding:22px}main{padding:22px 18px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="brand">My School System</div>
<p>Register your school and submit your application for developer approval.</p>
</header>
<main>
<div id="message" class="notice" role="status" aria-live="polite"></div>

<form id="schoolRegisterForm">
<h2>School Details</h2>
<div class="grid">
<div class="field">
<label for="schoolName">School Name *</label>
<input id="schoolName" required maxlength="150" placeholder="Enter school name">
</div>
<div class="field">
<label for="registrationNumber">School Registration Number *</label>
<input id="registrationNumber" required maxlength="80" placeholder="Official registration number">
</div>
<div class="field">
<label for="county">County *</label>
<input id="county" required maxlength="100" placeholder="Enter county">
</div>
<div class="field">
<label for="phone">School Phone *</label>
<input id="phone" required type="tel" maxlength="30" placeholder="School phone number">
</div>
<div class="field" style="grid-column:1/-1">
<label for="address">School Address *</label>
<input id="address" required maxlength="250" placeholder="Town or school location">
</div>
<div class="field" style="grid-column:1/-1">
<label for="schoolEmail">School Contact Email</label>
<input id="schoolEmail" type="email" maxlength="254" placeholder="school@example.com">
</div>
</div>

<div class="section">
<h2>Administrator Account</h2>
<div class="grid">
<div class="field">
<label for="fullName">Administrator Full Name *</label>
<input id="fullName" required maxlength="150" autocomplete="name">
</div>
<div class="field">
<label for="username">Username *</label>
<input id="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" placeholder="Choose username">
<div class="hint">Use letters, numbers, dots, underscores or hyphens.</div>
</div>
<div class="field">
<label for="adminEmail">Administrator Email *</label>
<input id="adminEmail" required type="email" maxlength="254" placeholder="you@example.com">
</div>
<div class="field">
<label for="adminPhone">Administrator Phone *</label>
<input id="adminPhone" required type="tel" maxlength="30">
</div>
<div class="field">
<label for="password">Password *</label>
<input id="password" required type="password" minlength="8" autocomplete="new-password">
</div>
<div class="field">
<label for="confirmPassword">Confirm Password *</label>
<input id="confirmPassword" required type="password" minlength="8" autocomplete="new-password">
</div>
</div>
<p class="hint">Your account will remain pending until a developer approves your school.</p>
</div>

<button class="btn" id="registerSchoolBtn" type="submit">Register School</button>
</form>

<div class="foot">Already registered? <a href="school-login.html">School Login</a></div>
</main>
</div>

<script>
(function(){
"use strict";

const SUPABASE_URL = "https://ksidteqtztpfgirfumdz.supabase.co";
const SUPABASE_KEY = "sb_publishable_uI1GpE80MIvV73I62Jnx0w_lIOWv3bs";

const form = document.getElementById("schoolRegisterForm");
const button = document.getElementById("registerSchoolBtn");
const message = document.getElementById("message");

function showMessage(text,type){
  message.textContent = text;
  message.className = "notice show " + type;
}

function value(id){
  return document.getElementById(id).value.trim();
}

if(!window.supabase){
  showMessage("Supabase could not load. Check your internet connection and refresh the page.","error");
  button.disabled = true;
  return;
}

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

form.addEventListener("submit",async function(event){
  event.preventDefault();

  if(button.disabled) return;

  if(!form.reportValidity()){
    showMessage("Please complete all required fields correctly.","error");
    return;
  }

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(password.length < 8){
    showMessage("Password must contain at least 8 characters.","error");
    return;
  }

  if(password !== confirmPassword){
    showMessage("The passwords do not match.","error");
    return;
  }

  button.disabled = true;
  button.textContent = "Registering...";
  showMessage("Submitting your registration. Please wait.","info");

  try{
    const email = value("adminEmail").toLowerCase();

    const {data,error} = await db.auth.signUp({
      email: email,
      password: password,
      options:{
        data:{
          registration_type:"school_admin",
          full_name:value("fullName"),
          username:value("username"),
          phone:value("adminPhone"),
          school_name:value("schoolName"),
          school_registration_number:value("registrationNumber"),
          school_county:value("county"),
          school_address:value("address"),
          school_contact_email:value("schoolEmail") || email,
          school_phone:value("phone")
        }
      }
    });

    if(error) throw error;

    if(data.user && data.user.identities && data.user.identities.length === 0){
      throw new Error("This email may already be registered. Try another email or sign in.");
    }

    if(!data.user){
      throw new Error("Supabase did not create a user. Check your Supabase Authentication settings.");
    }

    form.reset();

    if(data.session){
      await db.auth.signOut();
    }

    showMessage(
      "Registration submitted. Check your email if confirmation is required. Your school administrator account must be approved by the developer before you can access the system.",
      "success"
    );

  }catch(error){
    console.error("School registration error:",error);
    showMessage("Registration failed: " + (error.message || "Unknown error"),"error");
  }finally{
    button.disabled = false;
    button.textContent = "Register School";
  }
});
})();
</script>
</body>
</html>
