
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My School System | Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5fb;font-family:Arial,sans-serif;color:#17233f;padding:18px}
.card{width:100%;max-width:430px;background:white;padding:28px;border-radius:15px;box-shadow:0 10px 35px #10234a15}
h1{font-size:25px;margin:0 0 8px}
p{color:#69758b;line-height:1.5}
label{display:block;margin:15px 0 6px;font-weight:bold;font-size:14px}
input{width:100%;padding:12px;border:1px solid #d4ddeb;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;background:#4169e1;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
button:disabled{opacity:.6}
#message{white-space:pre-wrap;line-height:1.5;margin-top:15px}
.error{color:#b42318}.success{color:#16713c}
a{color:#4169e1}
</style>
</head>
<body>
<div class="card">
  <h1>My School System</h1>
  <p>Sign in using your registered email address and password.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="username" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password">

    <button id="loginBtn" type="submit">Sign in</button>
  </form>

  <div id="message" role="status"></div>
  <p>Not registered yet? <a href="school-register.html">Register your school</a></p>
</div>

<script>
const SUPABASE_URL = "https://ksidteqtztpfgirfumdz.supabase.co";
const SUPABASE_KEY = "sb_publishable_uI1GpE80MIvV73I62Jnx0w_lIOWv3bs";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("message");

function show(text, type="") {
  msg.textContent = text;
  msg.className = type;
}

async function routeUser(user) {
  const {data:profile, error} = await db
    .from("msys_user_profiles")
    .select("role,status,school_id")
    .eq("id", user.id)
    .maybeSingle();

  if (error) throw error;

  if (!profile) {
    await db.auth.signOut();
    throw new Error("Your user profile is not ready. Contact the developer.");
  }

  if (profile.role === "developer" && profile.status === "active") {
    window.location.replace("developer.html");
    return;
  }

  if (profile.role === "school_admin") {
    if (profile.status === "pending") {
      await db.auth.signOut();
      throw new Error("Your school administrator account is waiting for developer approval.");
    }
    if (profile.status === "rejected") {
      await db.auth.signOut();
      throw new Error("Your registration was rejected. Contact the developer.");
    }
    if (profile.status === "suspended") {
      await db.auth.signOut();
      throw new Error("Your account is suspended. Contact the developer.");
    }
    if (profile.status === "active") {
      window.location.replace("school-admin.html");
      return;
    }
  }

  await db.auth.signOut();
  throw new Error("Your account role or status does not allow access yet.");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  btn.disabled = true;
  show("Signing in...");

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const {data, error} = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    show("Checking account approval...");

    try {
      await routeUser(data.user);
    } catch (routeError) {
      show(routeError.message || "Unable to verify account access.", "error");
    }
  } catch (error) {
    show(error.message || "Sign-in failed.", "error");
  } finally {
    btn.disabled = false;
  }
});

(async function checkExistingSession() {
  const {data:{session}} = await db.auth.getSession();
  if (session) {
    try {
      await routeUser(session.user);
    } catch (error) {
      show(error.message || "Please sign in again.", "error");
    }
  }
})();
</script>
</body>
</html>
