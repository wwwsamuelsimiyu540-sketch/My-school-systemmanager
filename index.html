
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School System | Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#142447;--blue:#3159b8;--bg:#f2f5fb;--muted:#68758c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Arial,sans-serif;
display:flex;align-items:center;justify-content:center;padding:18px;color:var(--navy)}
.card{width:100%;max-width:420px;background:white;border-radius:20px;padding:30px;
box-shadow:0 12px 40px #14244712}
.logo{width:58px;height:58px;background:var(--navy);color:white;border-radius:15px;
display:grid;place-items:center;font-size:27px;margin-bottom:18px}
h1{font-size:25px;margin:0 0 8px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 24px}
label{display:block;font-size:14px;font-weight:bold;margin:17px 0 8px}
input{width:100%;padding:14px;border:1px solid #d6deeb;border-radius:10px;
font-size:16px;outline:none}
input:focus{border-color:var(--blue)}
button{width:100%;padding:14px;background:var(--blue);color:white;border:0;
border-radius:10px;font-size:16px;font-weight:bold;margin-top:22px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.links{text-align:center;margin-top:20px;font-size:14px;line-height:2}
a{color:var(--blue);text-decoration:none}
#message{display:none;margin-top:17px;padding:12px;border-radius:9px;
font-size:14px;line-height:1.5;overflow-wrap:anywhere}
#message.show{display:block}
#message.error{background:#fff0f0;color:#a52222}
#message.info{background:#eef4ff;color:#2449a5}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">✦</div>
  <h1>My School System</h1>
  <p class="subtitle">Sign in securely to access your school management dashboard.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="username"
      placeholder="Enter your registered email" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password"
      placeholder="Enter your password" required>

    <button id="submitButton" type="submit">Sign In</button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="links">
    <a href="school-register.html">Register a school</a>
    <br>
    <a href="school-login.html">School administrator login</a>
  </div>

  <footer>My School System &copy; 2026</footer>
</main>

<script>
const SUPABASE_URL = "https://ksidteqtztpfgirfumdz.supabase.co";
const SUPABASE_KEY = "sb_publishable_uI1GpE80MIvV73I62Jnx0w_lIOWv3bs";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

let routing = false;

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "show " + type;
}

function setBusy(busy) {
  button.disabled = busy;
  button.textContent = busy ? "Checking account..." : "Sign In";
}

async function routeUser(user) {
  if (routing) return;
  routing = true;
  setBusy(true);
  showMessage("Checking your account and permissions...", "info");

  try {
    const { data: profile, error: profileError } =
      await supabaseClient
        .from("msys_user_profiles")
        .select("id, role, status, school_id")
        .eq("id", user.id)
        .maybeSingle();

    if (profileError) throw profileError;

    if (!profile) {
      throw new Error(
        "No user profile was found for this account. Contact the developer."
      );
    }

    const role = String(profile.role || "").toLowerCase();
    const status = String(profile.status || "").toLowerCase();

    // Developer dashboard
    if (role === "developer" || role === "platform_developer") {
      if (status !== "active") {
        throw new Error(
          "Your developer profile is not active. Contact the system administrator."
        );
      }

      window.location.replace("developer.html");
      return;
    }

    // All other users must have an active profile.
    if (status === "pending") {
      throw new Error("Your account is pending approval.");
    }

    if (status !== "active") {
      throw new Error(
        "Your account is not active. Contact the system developer."
      );
    }

    // School administrator dashboard
    if (role === "school_admin") {
      if (!profile.school_id) {
        throw new Error("Your account is not linked to a school.");
      }

      const { data: school, error: schoolError } =
        await supabaseClient
          .from("msys_schools")
          .select("status")
          .eq("id", profile.school_id)
          .maybeSingle();

      if (schoolError) throw schoolError;

      if (!school) {
        throw new Error("Your school record could not be found.");
      }

      const schoolStatus = String(school.status || "").toLowerCase();

      if (schoolStatus !== "approved") {
        throw new Error(
          "Your school is not approved yet. Please wait for developer approval."
        );
      }

      window.location.replace("school-admin.html");
      return;
    }

    // These dashboards must exist before these roles can use them.
    const dashboardFiles = {
      teacher: "teacher-dashboard.html",
      bursar: "bursar-dashboard.html",
      student: "student-dashboard.html",
      parent: "parent-dashboard.html"
    };

    if (dashboardFiles[role]) {
      throw new Error(
        "Your account role is " + role +
        ", but its dashboard file has not been added yet. " +
        "Please contact the developer."
      );
    }

    throw new Error(
      "This account has no recognized dashboard role. Contact the developer."
    );

  } catch (error) {
    routing = false;
    setBusy(false);
    showMessage(
      error.message || "Could not verify your account. Please try again."
    );
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (routing) return;

  setBusy(true);
  showMessage("");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    await routeUser(data.user);

  } catch (error) {
    setBusy(false);
    showMessage(
      error.message || "Login failed. Check your email and password."
    );
  }
});

// If the user already has a valid session, route them automatically.
(async function checkExistingSession() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) throw error;

    if (data.session) {
      await routeUser(data.session.user);
    }
  } catch (error) {
    showMessage(
      error.message || "Could not check your existing session."
    );
  }
})();
</script>
</body>
</html>
